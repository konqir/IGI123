{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Смена пароля - Косметологический центр{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h2 class="card-title text-center mb-4">Смена пароля</h2>
                <p class="text-center text-muted mb-4">Используйте форму ниже, чтобы изменить свой пароль.</p>
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary mt-3">Изменить пароль</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
