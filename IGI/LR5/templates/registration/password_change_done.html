{% extends 'base.html' %}

{% block title %}Пароль изменен - Косметологический центр{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm p-4 text-center">
            <h2 class="card-title text-success mb-4"><i class="fas fa-check-circle me-2"></i>Пароль успешно изменен!</h2>
            <p class="lead">Ваш пароль был успешно изменен. Теперь вы можете использовать новый пароль для входа.</p>
            <div class="mt-4">
                <a href="{% url 'accounts:login' %}" class="btn btn-primary me-2">Войти с новым паролем</a>
                <a href="{% url 'core:home' %}" class="btn btn-outline-secondary">На главную</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
