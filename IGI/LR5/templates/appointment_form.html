{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Записаться на прием - Косметологический центр{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h2 class="card-title text-center mb-4">Записаться на прием</h2>
                <p class="text-center text-muted mb-4">Выберите врача, услугу, дату и время для вашего визита.</p>

                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary mt-3">Записаться на прием</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
